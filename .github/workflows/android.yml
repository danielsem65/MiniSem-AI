name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Set up Android SDK
      shell: bash
      run: |
        set -euo pipefail
        SDK_ROOT="${ANDROID_ROOT:-/usr/local/lib/android/sdk}"
        CMDBIN="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f -path '*/bin/*' 2>/dev/null | sort -V | tail -n1)"
        if [ -z "$CMDBIN" ]; then
          echo "::error::sdkmanager not found under $SDK_ROOT/cmdline-tools"
          exit 1
        fi
        echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
        echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
        echo "$(dirname "$CMDBIN")" >> "$GITHUB_PATH"
    - name: Install Android build tools
      run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
    - name: Build with Gradle
      run: ./gradlew assembleDebug